<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madilium - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-sm border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">Madilium Admin 🔐</h1>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-gray-400">Email</label>
                <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-400">Mot de passe</label>
                <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-blue-500 outline-none">
            </div>

            <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded transition-all">
                Se connecter
            </button>
            
            <button type="button" id="btn-signup" class="w-full border border-gray-600 hover:bg-gray-700 text-gray-300 text-sm py-2 rounded transition-all">
                Créer un compte (1ère fois)
            </button>
        </form>

        <p id="message" class="mt-4 text-center text-sm text-red-400 hidden"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⚠️ REMPLACE AVEC TA CLE PUBLIQUE
        const supabaseUrl = 'https://bnlulwzdydndednqronj.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubHVsd3pkeWRuZGVkbnFyb25qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1NzcyOTUsImV4cCI6MjA4MzE1MzI5NX0.61uU0cnxG-kX8IivE3gME48ECc1tD-stt8VGb5tF6EU' 
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const msg = document.getElementById('message');

        // CONNEXION
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.classList.add('hidden');
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value,
            });

            if (error) {
                msg.innerText = "Erreur : " + error.message;
                msg.classList.remove('hidden');
            } else {
                // Succès -> On va vers l'admin
                window.location.href = '/admin';
            }
        });

        // INSCRIPTION (Juste pour toi au début)
        document.getElementById('btn-signup').addEventListener('click', async () => {
            const { data, error } = await supabase.auth.signUp({
                email: emailInput.value,
                password: passwordInput.value,
            });

            if (error) {
                msg.innerText = "Erreur Inscription : " + error.message;
                msg.classList.remove('hidden');
            } else {
                msg.innerText = "Compte créé ! Tu peux te connecter.";
                msg.className = "mt-4 text-center text-sm text-green-400 block";
            }
        });
    </script>
</body>
</html>
