<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madilium - Inscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center py-10">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
        <h1 class="text-2xl font-bold mb-2 text-center text-green-400">Rejoindre Madilium 🚀</h1>
        <p class="text-gray-400 text-center text-sm mb-6">Créez votre espace client professionnel</p>
        
        <form id="signup-form" class="space-y-4">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Prénom</label>
                    <input type="text" id="prenom" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-green-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-400">Nom</label>
                    <input type="text" id="nom" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-green-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm mb-1 text-gray-400">Nom de l'entreprise</label>
                <input type="text" id="company" placeholder="Ex: Pizzeria Luigi" class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-green-500 outline-none">
            </div>

            <div>
                <label class="block text-sm mb-1 text-gray-400">Téléphone</label>
                <input type="tel" id="phone" placeholder="06..." class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-green-500 outline-none">
            </div>

            <hr class="border-gray-700 my-4">

            <div>
                <label class="block text-sm mb-1 text-gray-400">Email professionnel</label>
                <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-400">Mot de passe (6 carac. min)</label>
                <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-green-500 outline-none">
            </div>

            <button type="submit" id="btn-signup" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded transition-all mt-4">
                Créer mon compte
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span class="text-gray-500">Déjà inscrit ?</span>
            <a href="/admin/login.html" class="text-green-400 hover:text-green-300 ml-1 font-semibold">Se connecter</a>
        </div>

        <p id="message" class="mt-4 text-center text-sm text-red-400 hidden"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://bnlulwzdydndednqronj.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubHVsd3pkeWRuZGVkbnFyb25qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1NzcyOTUsImV4cCI6MjA4MzE1MzI5NX0.61uU0cnxG-kX8IivE3gME48ECc1tD-stt8VGb5tF6EU' // ⚠️ TA CLE
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-signup');
            const msg = document.getElementById('message');
            
            btn.disabled = true;
            btn.innerText = "Création en cours...";
            msg.classList.add('hidden');

            // Récupération des infos
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const metaData = {
                first_name: document.getElementById('prenom').value,
                last_name: document.getElementById('nom').value,
                company: document.getElementById('company').value,
                phone: document.getElementById('phone').value
            };

            // Envoi à Supabase avec les métadonnées
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: metaData // C'est ici qu'on sauve les infos supplémentaires !
                }
            });

            if (error) {
                msg.innerText = "Erreur : " + error.message;
                msg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Créer mon compte";
            } else {
                msg.innerHTML = "✅ Compte créé avec succès ! <br> Redirection...";
                msg.className = "mt-4 text-center text-sm text-green-500 block";
                
                // On connecte automatiquement et on redirige
                setTimeout(() => {
                    window.location.href = '/admin';
                }, 1500);
            }
        });
    </script>
</body>
</html>
