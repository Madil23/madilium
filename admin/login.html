<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madilium - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-sm border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">Madilium Admin 🔐</h1>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-gray-400">Email</label>
                <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-400">Mot de passe</label>
                <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-blue-500 outline-none">
            </div>

            <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded transition-all">
                Se connecter
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span class="text-gray-500">Nouveau client ?</span>
            <a href="/admin/signup.html" class="text-blue-400 hover:text-blue-300 ml-1 font-semibold">Créer un compte</a>
        </div>

        <p id="message" class="mt-4 text-center text-sm text-red-400 hidden"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://bnlulwzdydndednqronj.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubHVsd3pkeWRuZGVkbnFyb25qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1NzcyOTUsImV4cCI6MjA4MzE1MzI5NX0.61uU0cnxG-kX8IivE3gME48ECc1tD-stt8VGb5tF6EU' // ⚠️ TA CLE
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const msg = document.getElementById('message');
            
            btn.innerText = "Chargement...";
            msg.classList.add('hidden');
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            });

            if (error) {
                msg.innerText = "Erreur : " + error.message;
                msg.classList.remove('hidden');
                btn.innerText = "Se connecter";
            } else {
                window.location.href = '/admin/builder.html';
            }
        });
    </script>
</body>
</html>
