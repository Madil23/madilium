<!DOCTYPE html>
<html lang="fr">
<head>

        <div class="mx-auto w-24 h-24 rounded-full flex items-center justify-center text-4xl font-bold text-white shadow-lg mb-6 transform hover:scale-105 transition-transform duration-300"
             id="avatar-box">

        <h1 id="title" class="text-3xl font-bold text-gray-800 mb-2 tracking-tight">...</h1>

        <div class="mt-8 text-xs text-gray-400">
            Propulsé par <span class="font-bold text-gray-600">Madilium</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://bnlulwzdydndednqronj.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubHVsd3pkeWRuZGVkbnFyb25qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1NzcyOTUsImV4cCI6MjA4MzE1MzI5NX0.61uU0cnxG-kX8IivE3gME48ECc1tD-stt8VGb5tF6EU' // ⚠️ REMETS TA CLE ICI !
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey)

        async function loadProfile() {
            // 1. Récupérer le slug intelligemment
            let slug = window.location.pathname.substring(1); 
            if (!slug || slug.length < 1) {
                const params = new URLSearchParams(window.location.search);
                slug = params.get('client') || 'demo';
            }

            // 2. Chercher dans Supabase
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('slug', slug)
                .single();

            if (error || !data) {
                document.body.innerHTML = "<h1 class='text-white text-center mt-20'>Site introuvable (404)</h1>";
                return;
            }

            // 3. Remplir le Template (Design System)
            document.title = data.business_name;
            document.getElementById('title').innerText = data.business_name;
            document.getElementById('bio').innerText = data.bio || "Bienvenue sur ma page officielle.";
            
            // Avatar (Première lettre)
            document.getElementById('avatar-letter').innerText = data.business_name.charAt(0).toUpperCase();

            // Gestion des Couleurs Intelligente
            const color = data.primary_color || '#3B82F6';
            
            // Le fond de la page (dégradé sombre basé sur la couleur)
            document.body.style.background = `radial-gradient(circle at top, ${color}33, #111827)`;
            
            // Le bouton et l'avatar prennent la couleur exacte
            document.getElementById('insta-link').style.backgroundColor = color;
            document.getElementById('avatar-box').style.backgroundColor = color;
            document.getElementById('accent-circle').style.backgroundColor = color;

            // Liens
            document.getElementById('insta-link').href = data.instagram_url || "#";

            // Afficher la carte avec animation
            document.getElementById('main-card').classList.remove('hidden');
        }

        loadProfile();
    </script>
</body>
</html>
