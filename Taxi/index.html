<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Taxi Driver in Rome | Luxury Transfers</title>
    <meta name="description" content="Private chauffeur in Rome. Airport transfers Fiumicino, Ciampino and Civitavecchia port. We speak English, French, Italian, and Spanish.">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.6.6/css/flag-icons.min.css"/>

    <style>
        :root {
            --gold: #D4AF37;       /* Or Classique */
            --dark: #0a0a0a;       /* Noir Profond */
            --grey: #1a1a1a;       /* Gris Anthracite */
            --white: #ffffff;
            --whatsapp: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Lato', sans-serif; 
            background-color: var(--dark); 
            color: var(--white); 
            line-height: 1.6;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; letter-spacing: 1px; }
        
        /* --- HEADER --- */
        header {
            background: rgba(10, 10, 10, 0.90);
            padding: 20px;
            position: fixed; width: 100%; z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(5px);
        }

        .logo { 
            font-size: 1.1rem; font-weight: 700; color: var(--gold); text-transform: uppercase; 
            text-decoration: none; border: 2px solid var(--gold); padding: 5px 10px;
        }

        .header-btn {
            background: var(--gold); color: var(--dark);
            padding: 8px 15px; border-radius: 2px; text-decoration: none;
            font-weight: bold; font-size: 0.9rem; text-transform: uppercase;
        }

        /* --- HERO SECTION (LA VUE) --- */
        .hero {
            flex-grow: 1;
            min-height: 85vh;
            /* L'image doit s'appeler rome-taxi.jpg et être dans le dossier */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.3)), url('https://i.imgur.com/XO4yLVL.jpeg');
            background-size: cover; 
            background-position: center bottom; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }

        .hero h1 {
            font-size: 3.5rem; margin-bottom: 15px; color: var(--white);
            text-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        
        .hero p {
            font-size: 1.3rem; margin-bottom: 25px; color: #f0f0f0; font-weight: 300;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* BARRE DE LANGUES */
        .languages {
            margin-bottom: 35px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; gap: 15px;
        }
        .lang-text {
            font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--gold);
            text-transform: uppercase; letter-spacing: 1px;
        }
        /* Style des drapeaux */
        .fi {
            font-size: 1.5rem; /* Taille des drapeaux */
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .cta-btn {
            background: var(--whatsapp); color: white;
            padding: 18px 35px; border-radius: 50px;
            text-decoration: none; font-size: 1.2rem; font-weight: bold;
            display: inline-flex; align-items: center; gap: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s, background 0.3s;
            border: 2px solid white;
        }
        .cta-btn:hover { transform: scale(1.05); background: #1ebd57; }

        /* --- CONTACT RAPIDE --- */
        .contact-strip {
            background: var(--gold); color: var(--dark);
            padding: 20px 20px; text-align: center;
            border-top: 5px solid var(--white);
        }
        .contact-strip h2 { margin-bottom: 10px; font-size: 2rem;}
        .subtitle { font-size: 1rem; margin-bottom: 30px; font-style: italic; opacity: 0.8; }
        
        .contact-info { font-size: 1.3rem; font-weight: bold; margin: 15px 0; }
        .contact-link { 
            color: var(--dark); text-decoration: none; 
            border-bottom: 2px solid var(--dark); padding-bottom: 2px;
            transition: 0.2s;
        }
        .contact-link:hover { opacity: 0.7; border-bottom-color: transparent; }

        /* --- FOOTER --- */
        footer {
            background: var(--dark); padding: 30px; text-align: center;
            font-size: 0.8rem; color: #777; border-top: 1px solid #222;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .header-btn { display: none; }
            .hero { background-position: flex-end; } 
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">My Taxi Driver<br><span style="font-size:0.6em; font-family:'Lato'; letter-spacing: 2px;">in Rome</span></a>
        <a href="https://wa.me/393505448765" class="header-btn"><i class="fab fa-whatsapp"></i> Book Now</a>
    </header>

    <section class="hero">

        <p>Official Taxi, Smile and Laugh !</p>
        
        <div class="languages">
            <span class="lang-text">We speak:</span>
            <span class="fi fi-gb" title="English"></span>
            <span class="fi fi-fr" title="Français"></span>
            <span class="fi fi-it" title="Italiano"></span>
            <span class="fi fi-es" title="Español"></span>
        </div>

        <a href="https://wa.me/393505448765?text=Hello,%20I%20would%20like%20to%20book%20a%20transfer%20in%20Rome." class="cta-btn">
            <i class="fab fa-whatsapp"></i> Book via WhatsApp
        </a>
    </section>

    <section class="contact-strip">
        <h2>Contact Us</h2>
        <p class="subtitle">Fast response guaranteed.</p>
        
        <div class="contact-info">
            <i class="fas fa-envelope"></i> 
            <a href="mailto:mytaxidriverinrome@gmail.com" class="contact-link">mytaxidriverinrome@gmail.com</a>
        </div>
        
        <div class="contact-info">
            <i class="fab fa-whatsapp"></i> 
            <a href="https://wa.me/393505448765" class="contact-link">+39 350 544 8765</a>
        </div>
    </section>

    <footer>
        &copy; 2024 My Taxi Driver in Rome. Powered by Madilium.
    </footer>

</body>
</html>
